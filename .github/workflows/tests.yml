name: tests

on:
  push:
    paths: ["tools/**", "tests/**", "docs/**", ".github/workflows/**", "*.txt", "README.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'Londopy/the-long-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
