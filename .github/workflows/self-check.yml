name: self-check

# Runs in any fork that turns Actions on, on every push. It checks your link
# with the same rules the tracker uses, prints PASS or what to fix, and never
# commits anything. (No repository guard: it's meant to run in forks.)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/selfcheck.py
